<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Takliflar — Fixly.uz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue: #1a56db; --green: #3ab246; --gray-bg: #f4f6fb; --gray-text: #6b7280; --dark: #111827; --border: #e5e7eb; }
    body { font-family: 'Inter', sans-serif; background: var(--gray-bg); color: var(--dark); }
    nav { background: white; box-shadow: 0 1px 8px rgba(0,0,0,0.08); padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 20px; font-weight: 800; color: var(--blue); text-decoration: none; }
    .nav-logo span { color: var(--green); }
    .nav-back { color: var(--gray-text); text-decoration: none; font-size: 14px; font-weight: 600; }

    .container { max-width: 600px; margin: 0 auto; padding: 20px 16px 48px; }

    .zayavka-box { background: white; border-radius: 16px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .zayavka-label { font-size: 12px; color: var(--gray-text); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
    .zayavka-text { font-size: 15px; font-weight: 700; }

    .page-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: var(--gray-text); margin-bottom: 16px; }

    .tcard { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; border: 2px solid transparent; }
    .t-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .t-av { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--green)); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: white; flex-shrink: 0; }
    .t-name { font-size: 15px; font-weight: 700; }
    .t-job { font-size: 12px; color: var(--gray-text); }
    .t-stars { font-size: 12px; color: #f59e0b; margin-top: 2px; }

    .t-details { display: flex; gap: 20px; margin-bottom: 12px; }
    .t-detail-label { font-size: 11px; color: var(--gray-text); }
    .t-detail-val { font-size: 16px; font-weight: 800; }
    .t-price { color: var(--blue); }

    .t-izoh { background: var(--gray-bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--gray-text); margin-bottom: 12px; }

    .btn-tanla { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--green), #2d9e38); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-tanla:disabled { background: #e5e7eb; color: var(--gray-text); cursor: not-allowed; }

    .selected-badge { background: #d1fae5; color: #065f46; padding: 8px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 700; }

    .empty { text-align: center; padding: 48px 20px; color: var(--gray-text); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>

<nav>
  <a href="mijoz-dashboard.html" class="nav-back">← Orqaga</a>
  <a href="index.html" class="nav-logo">Fix<span>ly</span>.uz</a>
  <div style="width:60px;"></div>
</nav>

<div class="container">
  <div class="zayavka-box" id="zayavka-info">
    <div class="zayavka-label">Sizning zayavkangiz</div>
    <div class="zayavka-text">Yuklanmoqda...</div>
  </div>

  <div class="page-title">💬 Kelgan takliflar</div>
  <div class="page-sub">Eng mos ustani tanlang</div>

  <div id="list">
    <div class="empty"><div class="empty-icon">⏳</div>Yuklanmoqda...</div>
  </div>
</div>

<script>
var sb = supabase.createClient(
  'https://envyyamptxoqcfovdavm.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudnl5YW1wdHhvcWNmb3ZkYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTI4NDEsImV4cCI6MjA5NzAyODg0MX0.qB-977hSOnQYizkYCzQxIBBQNqcdxJ-pbpx98yCToMU'
);

var colors = ['linear-gradient(135deg,#1a56db,#1341b0)','linear-gradient(135deg,#7c3aed,#4f46e5)','linear-gradient(135deg,#f59e0b,#ef4444)','linear-gradient(135deg,#3ab246,#059669)'];

function getUser() {
  var v = localStorage.getItem('fixly_mijoz');
  if (v) { try { return JSON.parse(v); } catch(e) {} }
  return null;
}

var zayavkaId = null;

async function load() {
  var params = new URLSearchParams(window.location.search);
  zayavkaId = params.get('id');

  if (!zayavkaId) {
    document.getElementById('list').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Zayavka topilmadi</div>';
    return;
  }

  var zRes = await sb.from('zayavkalar').select('*').eq('id', zayavkaId).single();
  var zayavka = zRes.data;

  if (zayavka) {
    document.getElementById('zayavka-info').innerHTML =
      '<div class="zayavka-label">Sizning zayavkangiz</div>' +
      '<div class="zayavka-text">' + zayavka.muammo + '</div>';
  }

  var tRes = await sb.from('takliflar').select('*').eq('zayavka_id', zayavkaId).order('created_at', {ascending: true});
  var takliflar = tRes.data || [];

  if (takliflar.length === 0) {
    document.getElementById('list').innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>Hali taklif kelmadi<br/><span style="font-size:13px;">Ustalar javob berishini kuting</span></div>';
    return;
  }

  var selected = takliflar.find(function(t) { return t.status === 'accepted'; });

  var { data: ustalar } = await sb.from('ustalar').select('*');
  var { data: users } = await sb.from('users').select('*');

  var html = '';
  for (var i = 0; i < takliflar.length; i++) {
    var t = takliflar[i];
    var usta = ustalar ? ustalar.find(function(u) { return u.id === t.usta_id; }) : null;
    var user = usta ? users.find(function(u) { return u.id === usta.user_id; }) : null;
    var name = user ? user.full_name : 'Usta';
    var isSelected = t.status === 'accepted';

    html += '<div class="tcard" style="' + (isSelected ? 'border-color:#3ab246;' : '') + '">' +
      '<div class="t-top">' +
      '<div class="t-av" style="background:' + colors[i % colors.length] + ';">' + name[0].toUpperCase() + '</div>' +
      '<div><div class="t-name">' + name + '</div><div class="t-job">' + (usta ? usta.specialty : '') + '</div>' +
      '<div class="t-stars">★★★★★ ' + (usta ? usta.rating || 0 : 0) + ' • ' + (usta ? usta.total_jobs || 0 : 0) + ' ish</div></div>' +
      '</div>' +
      '<div class="t-details">' +
      '<div><div class="t-detail-label">NARX</div><div class="t-detail-val t-price">' + Number(t.narx).toLocaleString() + ' so\'m</div></div>' +
      '<div><div class="t-detail-label">VAQT</div><div class="t-detail-val">' + t.vaqt + '</div></div>' +
      '</div>' +
      (t.izoh ? '<div class="t-izoh">💬 ' + t.izoh + '</div>' : '') +
      (selected ?
        (isSelected ? '<div class="selected-badge">✅ Siz shu ustani tanladingiz</div>' : '<button class="btn-tanla" disabled>Boshqa usta tanlangan</button>') :
        '<button class="btn-tanla" onclick="tanlash(\'' + t.id + '\',\'' + name + '\',\'' + t.usta_id + '\')">✅ Shu ustani tanlash</button>'
      ) +
      '</div>';
  }
  document.getElementById('list').innerHTML = html;
}

async function tanlash(taklifId, ustaName, ustaId) {
  if (!confirm(ustaName + ' ni tanlaysizmi? Boshqa takliflar bekor qilinadi.')) return;

  try {
    // Tanlangan taklifni accepted qilish
    await sb.from('takliflar').update({status:'accepted'}).eq('id', taklifId);
    // Boshqalarini rejected qilish
    await sb.from('takliflar').update({status:'rejected'}).eq('zayavka_id', zayavkaId).neq('id', taklifId);
    // Zayavkani yopish
    await sb.from('zayavkalar').update({status:'closed'}).eq('id', zayavkaId);

    // Buyurtma yaratish
    var zRes = await sb.from('zayavkalar').select('*').eq('id', zayavkaId).single();
    var z = zRes.data;
    var user = getUser();

    await sb.from('buyurtmalar').insert([{
      problem: z.muammo,
      address: z.region,
      phone: user ? user.phone : '',
      date_time: new Date().toLocaleString('uz'),
      urgency: 'normal',
      status: 'active'
    }]);

    var msg = '✅ MIJOZ USTANI TANLADI!\n\n👷 Usta: ' + ustaName + '\n📋 Muammo: ' + z.muammo;
    await fetch('https://api.telegram.org/bot8816641134:AAH8O9IZGdjgfTyEuCNrWuu4ORW8ULh_Ipk/sendMessage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id:'8309575465', text: msg})
    });

    alert('✅ ' + ustaName + ' tanlandi! Endi bog\'lanishingiz mumkin.');
    load();
  } catch(e) {
    alert('Xatolik: ' + e.message);
  }
}

window.onload = load;
</script>
</body>
</html>
